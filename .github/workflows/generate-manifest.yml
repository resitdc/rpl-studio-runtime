name: Generate Manifest

on:
  workflow_run:
    workflows: ["Build PHP Runtime", "Build Node Runtime", "Build Python Runtime", "Build Java Runtime"]
    types:
      - completed
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download Artifacts
        if: github.event.workflow_run != null
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: runtime/
          merge-multiple: true
      - name: Generate Manifest
        run: node scripts/generate_manifest.js
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add manifest/runtime.json
          git commit -m "Update runtime.json" || echo "No changes to commit"
          git push
