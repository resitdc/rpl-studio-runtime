name: Build Python Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Python Version to build'
        required: true
        default: '3.12.4'
  schedule:
    - cron: '0 0 * * 0' # Weekly rebuild

jobs:
  build-linux-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, android-arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - name: Build Python
        run: ./build/python.sh ${{ github.event.inputs.version || '3.12.4' }} ${{ matrix.target }}
      - name: Compress
        run: ./scripts/compress.sh python ${{ github.event.inputs.version || '3.12.4' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: runtime/

  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [macos-x64, macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build Python
        run: ./build/python.sh ${{ github.event.inputs.version || '3.12.4' }} ${{ matrix.target }}
      - name: Compress
        run: ./scripts/compress.sh python ${{ github.event.inputs.version || '3.12.4' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: runtime/

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [windows-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build Python
        run: bash ./build/python.sh ${{ github.event.inputs.version || '3.12.4' }} ${{ matrix.target }}
      - name: Compress
        run: bash ./scripts/compress.sh python ${{ github.event.inputs.version || '3.12.4' }} ${{ matrix.target }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: runtime/

  release:
    needs: [build-linux-android, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: runtime/
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-v${{ github.event.inputs.version || '3.12.4' }}
          name: Python v${{ github.event.inputs.version || '3.12.4' }}
          files: |
            runtime/**/*.tar.gz
            runtime/**/*.zip
            runtime/**/*.sha256
          make_latest: true
